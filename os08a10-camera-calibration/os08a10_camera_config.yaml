  geometry_relevant_controls: none - the module exposes no zoom / pan / tilt / focus; geometry depends only on the MODE (resolution + format) and the physical lens
  recommended_for_measurement:
    white_balance_automatic: 0
    exposure_dynamic_framerate: 0
    backlight_compensation: 0
    auto_exposure: 1 (manual) with exposure_time_absolute as short as the light allows (<= 200 = 20 ms; units of 100 us) and the lowest gain that gives white board
      areas ~200/255
    note: exposure / gain / white balance do NOT change the calibration; they change image quality
  settings_policy: calibration tools snapshot all controls, apply their lock, and restore the original values afterwards (also on Ctrl-C) - other projects see the
    camera unchanged
rules_to_keep_calibration_valid:
- Use each calibration ONLY with its own resolution AND pixel format (the mode key, e.g. 3840x2160_MJPG).
- Never touch or turn the lens - lock the M12 thread (thread-lock / glue) for production.
- Let the camera stream ~10 min before precision measurement (focal length drifts while warming up).
- Do not resize / stretch frames; crop or pad only, and shift cx / cy by the crop or pad offset.
- Re-verify periodically (e.g. weekly, or after any knock) with a known reference object; recalibrate if > 0.2 mm off.
- 'Before production sign-off: measure 3-5 known lengths at the working distance (centre and edges); all errors < ~0.3 mm.'
usage:
  python_camcal: 'from camcal.runtime import CalibrationStore; cal = CalibrationStore(''calibrations'').for_frame(frame)  # picks the mode by frame size (pass fourcc=''YUYV''
    for YUYV); cal.undistort_image(frame), cal.undistort_points(pts), cal.pixels_to_plane(pts, rvec, tvec), cal.mm_per_px(z_mm)'
  plain_opencv: fs = cv2.FileStorage('calibrations/3840x2160_MJPG/camera_3840x2160_MJPG.yaml', cv2.FILE_STORAGE_READ); K = fs.getNode('camera_matrix').mat(); D =
    fs.getNode('distortion_coefficients').mat(); und = cv2.undistort(frame, K, D)
  board_used: ChArUco A3, 14x10 squares, 25 mm squares, 18.75 mm markers, DICT_4X4_100 (boards/charuco_a3.pdf)
